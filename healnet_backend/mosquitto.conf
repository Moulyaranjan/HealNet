# HEALNET - local Mosquitto broker (Mosquitto 2.x)
#   run:  mosquitto -c mosquitto.conf -v

listener 1883
# Prototype only: no passwords. Before exposing this to anything other than your own
# laptop/LAN, create a password file (mosquitto_passwd) and set allow_anonymous false.
allow_anonymous true

# Keep retained messages (node status, summary, coordinator state) and persistent
# sessions across broker restarts.
persistence true
persistence_location ./mosquitto_data/
autosave_interval 60

# The backend connects with clean_session=false, so while it is down the broker
# queues its QoS 1 subscriptions (sensor data) up to this many messages.
max_queued_messages 20000
persistent_client_expiration 7d
max_inflight_messages 100

log_type error
log_type warning
log_type notice

# ---- ADDED FOR THE DASHBOARD -------------------------------------------------
# Browsers cannot speak raw MQTT on 1883; they use MQTT over WebSockets.
# Same broker, same topics, extra door on port 9001.
listener 9001
protocol websockets
