# HEALNET local Mosquitto configuration (Mosquitto 2.x)
# Mosquitto 2 only accepts local connections unless a listener is declared.

listener 1883
allow_anonymous true          # fine for a lab laptop; add password_file before exposing to a network

persistence true              # keeps retained messages + queued QoS1 for offline clients
persistence_location ./mosquitto_data/
autosave_interval 60

max_queued_messages 1000      # per offline persistent client (e.g. the processor)
log_type error
log_type warning
log_type notice
